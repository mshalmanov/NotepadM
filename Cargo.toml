[package]
name = "notepadm"
version = "0.1.0"
edition = "2021"
description = "NotepadM — текстовый редактор на Rust + Slint"
license = "GPL-2.0-or-later"

[dependencies]
slint = "1"
rfd = "0.15"
open = "5"
encoding_rs = "0.8"
chardetng = "0.1"

[build-dependencies]
slint-build = "1"

# Только при сборке под Windows: встраивание иконки в ресурсы .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
