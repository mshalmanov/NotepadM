[package]
name = "notepadm"
version = "0.1.0"
edition = "2021"
description = "NotepadM — текстовый редактор на Rust + Slint"
license = "GPL-2.0-or-later"

[dependencies]
# unstable-winit-030 — доступ к событиям окна из библиотеки winit
# (перетаскивание файлов из проводника Slint сам пока не отдаёт).
slint = { version = "1", features = ["unstable-winit-030"] }
rfd = "0.15"
open = "5"
encoding_rs = "0.8"
chardetng = "0.1"

[build-dependencies]
slint-build = "1"

# Только при сборке под Windows: встраивание иконки в ресурсы .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Release-сборка: компилируется дольше, зато бинарник меньше и быстрее.
[profile.release]
lto = true        # оптимизация на этапе компоновки, между крейтами
codegen-units = 1 # один блок кодогенерации: медленнее собирать, плотнее код
strip = true      # убрать отладочные символы из бинарника
opt-level = "s"   # оптимизировать по размеру, а не по скорости
panic = "abort"   # паника = немедленное завершение, без раскрутки стека
