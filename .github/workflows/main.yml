name: Build JavaFX Application

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установим OpenJDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Установим dependencies и соберём проект
      - name: Build with Maven
        run: mvn -B clean install

      # Загрузка собранного JAR релиза (glob вместо версии — не сломается при бампе версии в pom.xml)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotepadM-artifact
          path: target/NotepadM-*.jar

  # Портативные самодостаточные сборки (JDK 21 вшит внутрь — пользователю
  # не нужен установленный Java) для каждой ОС через jpackage --type app-image:
  # папка с готовым к запуску исполняемым файлом, без мастера установки —
  # распаковал архив и сразу нажал на NotepadM(.exe).
  package-installers:
    name: Native build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jpackage-type: app-image
            artifact-name: NotepadM-windows-portable
            dist-glob: target/dist/NotepadM
          - os: macos-latest
            jpackage-type: dmg
            artifact-name: NotepadM-macos-installer
            dist-glob: target/dist/*.dmg
          - os: ubuntu-latest
            jpackage-type: app-image
            artifact-name: NotepadM-linux-portable
            dist-glob: target/dist/NotepadM
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Собирает shaded jar (target/NotepadM-1.0-SNAPSHOT.jar) — его же использует jpackage как вход
      - name: Build with Maven
        run: mvn -B clean install

      # jpackage (входит в JDK 21) упаковывает jar + JRE в нативный формат под текущую ОС:
      # переносимый app-image (папка с исполняемым файлом, без мастера установки)
      # на Windows и Linux, .dmg (стандартный способ распространения на macOS) на macOS
      - name: Build native installer with jpackage
        shell: bash
        run: |
          # отдельный staging-каталог только с jar-ом: --input не должен пересекаться
          # с --dest (target/dist), иначе jpackage рекурсивно копирует сам себя
          mkdir -p target/jpackage-input target/dist
          cp target/NotepadM-1.0-SNAPSHOT.jar target/jpackage-input/

          case "${{ matrix.os }}" in
            windows-latest)
              ICON_ARGS=(--icon src/main/resources/images/NotepadM.ICO)
              ;;
            macos-latest)
              ICON_ARGS=(--icon src/main/resources/images/NotepadM.icns)
              ;;
            ubuntu-latest)
              ICON_ARGS=(--icon src/main/resources/images/NotepadM-256.png)
              ;;
          esac

          jpackage \
            --input target/jpackage-input \
            --name NotepadM \
            --main-jar NotepadM-1.0-SNAPSHOT.jar \
            --main-class ru.filive.Launcher \
            --app-version 1.0.0 \
            --vendor "Marat Shalmanov" \
            --dest target/dist \
            --type ${{ matrix.jpackage-type }} \
            "${ICON_ARGS[@]}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.dist-glob }}
