name: Build JavaFX Application

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установим OpenJDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Установим dependencies и соберём проект
      - name: Build with Maven
        run: mvn -B clean install

      # Загрузка собранного JAR релиза (glob вместо версии — не сломается при бампе версии в pom.xml)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotepadM-artifact
          path: target/NotepadM-*.jar

      # Загрузка собранного EXE (Launch4j, фаза package)
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotepadM-exe
          path: target/NotepadM.exe
